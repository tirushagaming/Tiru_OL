<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TNS Students Handy!</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }

    /* Fullscreen content frame */
    #content-frame {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Top-Left Mute/Unmute Button */
    .mute-btn {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 999999;
      background: rgba(20, 20, 20, 0.85);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      backdrop-filter: blur(5px);
    }
    .mute-btn:hover { background: #000; color: #00d2ff; }
  </style>
</head>
<body>

  <button class="mute-btn" id="muteBtn">
    <i class="fa-solid fa-volume-high" id="speakerIcon"></i>
    <span id="muteText">Sound On</span>
  </button>

  <iframe src="home.html" id="content-frame"></iframe>

  <audio id="bgMusic" loop preload="auto">
    <source src="MCmusic.mp3" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById('bgMusic');
    const muteBtn = document.getElementById('muteBtn');
    const speakerIcon = document.getElementById('speakerIcon');
    const muteText = document.getElementById('muteText');
    const iframe = document.getElementById('content-frame');

    audio.volume = 0.7; // Default volume (70%)

    // Helper function to play audio safely on interaction
    function playAudio() {
      if (audio.paused) {
        audio.play().then(() => {
          console.log("Music started successfully!");
        }).catch(err => {
          console.log("Waiting for user interaction...", err);
        });
      }
    }

    // 1. LISTEN ON MAIN WINDOW (Click, Keydown, Scroll)
    ['click', 'keydown', 'wheel', 'scroll', 'touchstart'].forEach(eventType => {
      window.addEventListener(eventType, playAudio, { once: true });
    });

    // 2. ATTACH LISTENERS INSIDE THE IFRAME CONTENT
    function attachIframeListeners() {
      try {
        const iframeWindow = iframe.contentWindow;
        const iframeDoc = iframe.contentDocument || iframeWindow.document;

        // Triggers music on Click, Keypress, Mouse Wheel, Touch, or Scroll inside iframe
        ['click', 'keydown', 'wheel', 'scroll', 'touchstart', 'touchmove'].forEach(eventType => {
          iframeDoc.addEventListener(eventType, playAudio, { once: true });
          iframeWindow.addEventListener(eventType, playAudio, { once: true });
        });
      } catch (e) {
        console.log("Iframe listener attach warning:", e);
      }
    }

    // Attach listeners when iframe finishes loading a page
    iframe.addEventListener('load', attachIframeListeners);

    // 3. FALLBACK: WINDOW FOCUS / BLUR DETECTOR
    window.addEventListener('blur', () => {
      if (document.activeElement === iframe) {
        playAudio();
      }
    });

    // 4. MUTE / UNMUTE TOGGLE BUTTON
    muteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      
      // If user clicks mute button first, ensure audio starts
      if (audio.paused) {
        playAudio();
      }

      if (audio.muted) {
        audio.muted = false;
        speakerIcon.className = 'fa-solid fa-volume-high';
        muteText.textContent = 'Sound On';
      } else {
        audio.muted = true;
        speakerIcon.className = 'fa-solid fa-volume-xmark';
        muteText.textContent = 'Muted';
      }
    });
  </script>

</body>
</html>
